name: Check
'on': push
jobs:
  build:
    name: covr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TT_AT_HOME: "TRUE"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@master
      - name: Install Package Dependencies
        run: |-
          Rscript -e "install.packages(c('rcmdcheck', 'remotes', 'covr'), repos = 'https://cran.rstudio.com')"
          Rscript -e "remotes::install_deps(dependencies = TRUE, repos = 'https://cran.rstudio.com')"
      - name: Measure coverage
        run: Rscript -e "coverage <- covr::package_coverage(quiet = FALSE); print(coverage); covr::to_cobertura(coverage, filename = 'coverage.xml')"
      - name: Upload coverage
        uses: codecov/codecov-action@f9fe539f5290016afa014f8ef31597d3a61c2dea # v7
        with:
          files: coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
    container: rocker/verse:latest
  rcmdchecker:
    name: Rcmdcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@master
      - name: Install Package Dependencies
        run: |-
            Rscript -e "install.packages(c('rcmdcheck', 'remotes'), repos = 'https://cran.rstudio.com')"
            Rscript -e "remotes::install_deps(dependencies = TRUE, repos = 'https://cran.rstudio.com')"
      - name: Run Check
        run: Rscript -e "rcmdcheck::rcmdcheck(args = '--no-manual', build_args = '--no-manual', error_on = 'note')"
    container: rocker/verse:latest
  test-r-sanitizers:
    name: ASAN-UBSAN
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/r-hub/containers/gcc-asan:latest
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      NOT_CRAN: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5
          submodules: true
      - name: Install package dependencies
        shell: bash
        run: |
          R --version
          R CMD config CC
          # R-hub's Fedora binaries (including fracdiff) link this BLAS runtime.
          dnf install -y openblas-threads
          Rscript -e 'pak::pkg_install("deps::.", dependencies = TRUE)'
          Rscript -e 'library(fracdiff); library(forecast)'
      - name: Build and install with sanitizers
        shell: bash
        run: |
          R CMD build --no-manual --no-build-vignettes .
          R CMD INSTALL --install-tests grattan_*.tar.gz
          Rscript -e 'dll <- system.file("libs", paste0("grattan", .Platform$dynlib.ext), package = "grattan"); symbols <- system2("nm", c("-D", dll), stdout = TRUE); stopifnot(any(grepl("__asan_", symbols)), any(grepl("__ubsan_", symbols)))'
      - name: Run installed tests with sanitizers
        shell: bash
        run: |
          Rscript -e 'library(grattan); library(hutils); library(data.table); library(magrittr); data.table::setDTthreads(1L); tests <- system.file("tests", "testthat", package = "grattan"); stopifnot(dir.exists(tests), length(list.files(tests, pattern = "^test")) > 0L); testthat::test_package("grattan", reporter = "summary", stop_on_failure = TRUE)'
