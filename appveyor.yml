image: Visual Studio 2022

environment:
  global:
    _R_CHECK_CRAN_INCOMING_: "false"
    R_LIBS_USER: 'C:\RLibrary\%v'

# rig installs the current R release and its matching UCRT toolchain.
# The former r-appveyor bootstrap selected Rtools40 for every R 4.x release.
install:
  - ps: |
      $archive = Join-Path $env:TEMP 'rig-windows-x86_64-0.11.1.zip'
      $rigDir = Join-Path $env:ProgramFiles 'rig'
      Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/r-lib/rig/releases/download/v0.11.1/rig-windows-x86_64-0.11.1.zip' -OutFile $archive
      if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'a0ce65f2afb2f016488523818d14c4596080c61f32d0dab4c123c7f5e1db8910') {
        throw 'Unexpected SHA-256 for the rig Windows archive.'
      }
      Expand-Archive -LiteralPath $archive -DestinationPath $rigDir -Force
      $env:PATH = "$rigDir\bin;C:\Program Files\R\bin;$env:PATH"
  - cmd: rig add release
  - cmd: rig default release
  - cmd: rig add rtools
  - cmd: Rscript -e "dir.create(Sys.getenv('R_LIBS_USER'), recursive = TRUE, showWarnings = FALSE); .libPaths(Sys.getenv('R_LIBS_USER')); install.packages(c('remotes', 'rcmdcheck'), repos = 'https://cloud.r-project.org'); remotes::install_deps(dependencies = TRUE, upgrade = 'never', repos = 'https://cloud.r-project.org')"
  - cmd: R CMD INSTALL --preclean --clean .
  - cmd: Rscript -e "install.packages(c('taxstats', 'taxstats1516'), repos = 'https://hughparsonage.github.io/tax-drat', type = 'source'); stopifnot(requireNamespace('taxstats', quietly = TRUE), requireNamespace('taxstats1516', quietly = TRUE))"

cache:
  - C:\RLibrary -> appveyor.yml

build_script:
  - cmd: Rscript -e "rcmdcheck::rcmdcheck(args = c('--no-manual', '--as-cran'), build_args = '--no-manual', error_on = 'warning', check_dir = 'check')"

test: off

artifacts:
  - path: 'check\**\*.log'
    name: Logs
  - path: 'check\**\*.out'
    name: Logs
  - path: 'check\**\*.fail'
    name: Logs
  - path: 'check\**\*.Rout'
    name: Logs
  - path: 'check\*.tar.gz'
    name: Source
